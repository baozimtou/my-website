<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>示例页面</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="#workshops">车间管理</a>
      <a href="#units">机组编辑</a>
      <a href="#rooms">房间编辑</a>
      <a href="#points">点位编辑</a>
      <a href="#realtime">实时编辑</a>
      <a href="#stats">统计</a>
    </nav>

    <section id="view"></section>
  </div>
  <!-- 全局模态对话框 -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalSave">保存</button>
        <button id="modalCancel">取消</button>
      </div>
    </div>
  </div>
  <!-- 顶部 toast 容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js" onerror="onFirebaseLoadError()"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js" onerror="onFirebaseLoadError()"></script>

  <!-- Tencent CloudBase SDK -->
  <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.3.0/cloudbase.full.js"></script>

  <script>
    let backendType = 'firebase'; // 默认使用 firebase
    let firebaseLoadError = false;

    function onFirebaseLoadError() {
      if (firebaseLoadError) return; // 避免重复执行
      firebaseLoadError = true;
      console.log("Firebase SDK加载失败，切换到腾讯 CloudBase。");
      backendType = 'cloudbase';
      // 由于主脚本是 defer/async，我们需要确保在它执行前设置好 backendType
      // 如果 script.js 是同步加载，这里的逻辑需要调整
    }
  </script>

  <script src="script.js?v=20260604-2"></script>
</body>
</html>
